name: Build TR3600 V1 community firmware with USB and OpenClash

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tr3600-community-firmware
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      BUILD_JOBS: '4'
      USE_EXTERNAL_TOOLCHAIN: '0'
    steps:
      - name: Check out firmware recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare build dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget curl libelf-dev swig xsltproc zstd time
          nproc
          df -h .
      - name: Prepare pinned OpenWrt, feeds and OpenClash sources
        run: bash firmware/build.sh prepare
      - name: Check selected device, USB drivers and OpenClash dependencies
        run: bash firmware/build.sh configure
      - name: Restore matching host tools and compiler cache
        id: tool-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: tr3600-ubuntu24-gcc14.4-${{ hashFiles('firmware/sources.json', 'firmware/config.seed', 'crostia-v19/tr3600-support-rebased.patch') }}
          path: |
            full-openwrt/staging_dir/host
            full-openwrt/staging_dir/hostpkg
            full-openwrt/staging_dir/toolchain-*
            full-openwrt/build_dir/host
            full-openwrt/build_dir/hostpkg
            full-openwrt/build_dir/toolchain-*
      - name: Download corresponding component sources
        run: bash firmware/build.sh download
      - name: Build host tools and GCC 14.4.0 toolchain
        run: bash firmware/build.sh tools
      - name: Save host tools and compiler before building firmware
        if: steps.tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}
          path: |
            full-openwrt/staging_dir/host
            full-openwrt/staging_dir/hostpkg
            full-openwrt/staging_dir/toolchain-*
            full-openwrt/build_dir/host
            full-openwrt/build_dir/hostpkg
            full-openwrt/build_dir/toolchain-*
      - name: Build kernel, packages and sysupgrade image
        run: bash firmware/build.sh firmware
      - name: Check image, rootfs and same-build driver packages
        run: bash firmware/build.sh collect
      - name: Archive corresponding source without private signing keys
        run: bash firmware/build.sh source
      - name: Upload corresponding source and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tr3600-v1-community-firmware-source
          path: |
            full-artifacts/corresponding-source.tar.gz
            full-artifacts/SOURCE-SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload checked firmware candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tr3600-v1-usb-openclash-firmware-candidate
          path: |
            full-artifacts/*
            !full-artifacts/packages/**
            !full-artifacts/corresponding-source.tar.gz
            !full-artifacts/SOURCE-SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build configuration and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tr3600-community-build-audit
          include-hidden-files: true
          path: |
            full-*.log
            full-audit/*.txt
            full-audit/*.json
            full-audit/build.config
            full-openwrt/.config
            full-openwrt/tmp/.config-package.in
            full-openwrt/tmp/.packageinfo
          if-no-files-found: warn
          retention-days: 14

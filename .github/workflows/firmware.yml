name: Build TR3600 V1 community firmware with USB and OpenClash

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tr3600-community-firmware
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      BUILD_JOBS: '4'
      USE_EXTERNAL_TOOLCHAIN: '0'
    steps:
      - name: Check out firmware recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare build dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget curl libelf-dev swig xsltproc zstd time
          nproc
          df -h .
      - name: Prepare pinned OpenWrt, feeds and OpenClash sources
        run: bash firmware/build.sh prepare
      - name: Check selected device, USB drivers and OpenClash dependencies
        run: bash firmware/build.sh configure
      - name: Download corresponding component sources
        run: bash firmware/build.sh download
      - name: Build host tools and GCC 14.4.0 toolchain
        run: bash firmware/build.sh tools
      - name: Build kernel, packages and sysupgrade image
        run: bash firmware/build.sh firmware
      - name: Check image, rootfs and same-build driver packages
        run: bash firmware/build.sh collect
      - name: Archive corresponding source without private signing keys
        run: bash firmware/build.sh source
      - name: Upload checked firmware candidate and corresponding source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tr3600-v1-usb-openclash-firmware-candidate
          path: |
            full-artifacts/*
            !full-artifacts/packages/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build configuration and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tr3600-community-build-audit
          include-hidden-files: true
          path: |
            full-*.log
            full-audit/*.txt
            full-audit/*.json
            full-audit/build.config
            full-openwrt/.config
          if-no-files-found: warn
          retention-days: 14
